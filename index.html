<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kafe İşlet - Mahalle Kafesi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <header class="topbar">
      <div>
        <div class="eyebrow">☕ KAFE İŞLET</div>
        <h1>Mahalle Kafesi</h1>
      </div>
      <div class="money">💰 <span id="money">500</span> TL</div>
    </header>

    <section class="stats">
      <div>👥 <b id="customers">0</b><small>Müşteri</small></div>
      <div>⭐ <b id="rating">1.0</b><small>İtibar</small></div>
      <div>🪑 <b id="tableCount">4</b><small>Masa</small></div>
      <div>📅 <b id="day">1</b><small>Gün</small></div>
    </section>

    <main class="cafe" id="cafe">
      <div class="cafe-sign">☕ <b>Kafen açık!</b><span id="status">Müşteriler bekleniyor...</span></div>

      <div class="decor plant p1">🌿</div>
      <div class="decor plant p2">🪴</div>
      <div class="decor counter">🧁<br><small>TEZGAH</small></div>

      <div class="table" data-index="0" style="left:7%;top:24%"><span>Masa 1</span></div>
      <div class="table" data-index="1" style="left:61%;top:24%"><span>Masa 2</span></div>
      <div class="table" data-index="2" style="left:7%;top:60%"><span>Masa 3</span></div>
      <div class="table" data-index="3" style="left:61%;top:60%"><span>Masa 4</span></div>

      <div class="welcome">Müşteriler birazdan gelecek...<br><small>Masadan çıkan 🪙 simgesine dokun!</small></div>
    </main>

    <div class="actionbar">
      <button id="serveBtn">🍰 Hızlı Servis <small>+10 TL</small></button>
      <button id="upgradeBtn">🔨 Kafeyi Geliştir <small>150 TL</small></button>
      <button id="dayBtn">🌙 Günü Bitir</button>
    </div>

    <div id="log" class="log">☕ Kafen hazır. İlk müşteriler yolda!</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
